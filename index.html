<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Shelf</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #DFF1F1; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        .search-section, .library-section { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; }
        input { padding: 12px; width: 70%; border: 0px solid #ddd; border-radius: 6px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #007bff; }
        button { padding: 12px 24px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 20px; }
        
        /* Карточка книги */
        .book-card { background: #fff; border: 1px solid #eee; padding: 15px; text-align: center; border-radius: 10px; transition: transform 0.2s; position: relative; overflow: hidden; }
        .book-card:hover { transform: translateY(-5px); }
                .book-card img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            background: #ddd; /* Та самая серая плашка */
            flex-shrink: 0;
            
            /* ДОБАВЬТЕ ЭТИ СТРОКИ: */
            display: block;
            text-indent: -10000px; /* Прячет стандартный текст ошибки (атрибут alt) */
        }

        /* ТРЮК: Если картинка ломается или пустая, мы скрываем стандартный значок браузера */
        .book-card img:not([src]), 
        .book-card img[src=""], 
        .book-card img[src="undefined"],
        .book-card img:invalid {
            visibility: hidden; /* Скрывает саму иконку битого файла, оставляя серый фон */
        }

        .book-card p { font-size: 14px; font-weight: 600; margin: 10px 0; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-wrap: ellipsis; -webkit-box-orient: vertical; }
        .btn-add { background: #28a745; font-size: 13px; width: 100%; }
        .btn-remove { background: #dc3545; font-size: 13px; width: 100%; margin-top: auto;  }

        /* Стили для рейтинга при наведении */
        .rating-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
            flex-direction: row;        
            direction: ltr;
       }
        .book-card:hover .rating-overlay { opacity: 1; }
        
        .star { 
            cursor: pointer; 
            font-size: 25px; 
            color: #ccc; 
            transition: color 0.2s; 
        }
        
        /* Исправленный эффект наведения: красит текущую звезду и все, что СЛЕВА от неё */
        .rating-overlay:has(.star:hover) .star:hover,
        .rating-overlay:has(.star:hover) .star:has(~ .star:hover) { 
            color: #ffc107; 
        }
        
        /* Эффект для уже сохранённого выбора пользователя */
        .star.active { color: #ffc107; }

        .stars-display { color: #ffc107; font-size: 16px; margin-bottom: 5px; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Поиск книг (Open Library)</h1>
    
    <div class="search-control">
        <input type="text" id="searchInput" placeholder="Введите название книги на русском...">
        <button onclick="searchBooks()">Найти</button>
    </div>

    <div id="searchResults" class="book-grid"></div>

    <hr>

    <h2>📖 Моя библиотека</h2>
    <div id="library" class="book-grid"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', renderLibrary);

        async function searchBooks() {
        const query = document.getElementById('searchInput').value;
        if (!query) return;

        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '<p>Ищу в мировых библиотеках...</p>';

        try {
            // Используем Open Library Search API - он очень мощный и бесплатный
            const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            const data = await response.json();

            resultsDiv.innerHTML = '';

            if (!data.docs || data.docs.length === 0) {
                resultsDiv.innerHTML = '<p>Книги не найдены.</p>';
                return;
            }

            // Берем первые 20 результатов
            data.docs.slice(0, 20).forEach(doc => {
                const title = doc.title;
                // В Open Library обложки лежат по отдельному URL
                const coverId = doc.cover_i;
                const thumbnail = coverId 
                    ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg` 
                    : 'https://via.placeholder.com/150x220?text=Нет+обложки';
                
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${thumbnail}" alt="${title}">
                    <p>${title}</p>
                    <button class="btn-add" onclick="addToLibrary('${title.replace(/'/g, "\\'")}', '${thumbnail}')">В прочитанное</button>
                `;
                resultsDiv.appendChild(card);
            });
        } catch (error) {
            console.error('Ошибка:', error);
            resultsDiv.innerHTML = '<p>Ошибка при подключении к библиотеке.</p>';
        }
    }


    function addToLibrary(title, img) {
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        if (library.some(book => book.title === title)) {
            alert('Эта книга уже в списке!');
            return;
        }
        library.push({ title, img, rating: 0 });
        localStorage.setItem('myLibrary', JSON.stringify(library));
        renderLibrary();
    }

    function removeFromLibrary(index) {
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        library.splice(index, 1);
        localStorage.setItem('myLibrary', JSON.stringify(library));
        renderLibrary();
    }

    function setRating(index, rating) {
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        library[index].rating = rating;
        localStorage.setItem('myLibrary', JSON.stringify(library));
        renderLibrary();
    }

    function renderLibrary() {
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        const libraryDiv = document.getElementById('library');
        libraryDiv.innerHTML = '';

        if (library.length === 0) {
            libraryDiv.innerHTML = '<p>Список пуст. Начните поиск!</p>';
            return;
        }

        library.forEach((book, index) => {
            const card = document.createElement('div');
            card.className = 'book-card';
            
            // Создаем звезды для выбора (наведение)
            let starsHTML = `<div class="rating-overlay">`;
            for (let i = 1; i <= 5; i++) {
                starsHTML += `<span class="star" onclick="setRating(${index}, ${i})">★</span>`;
            }
            starsHTML += `</div>`;

            // Отображение текущего рейтинга
            const ratingStars = book.rating > 0 ? '★'.repeat(book.rating) : '';

            card.innerHTML = `
                ${starsHTML}
                <img src="${book.img}" alt="${book.title}">
                <div class="stars-display">${ratingStars}</div>
                <p>${book.title}</p>
                <button class="btn-remove" onclick="removeFromLibrary(${index})">Удалить</button>
            `;
            libraryDiv.appendChild(card);
        });
    }
</script>

</body>
</html>
